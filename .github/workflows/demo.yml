name: Demo & benchmarks

# Produces the artefacts shown in the README: the overload chart, the C++ vs Python stage
# comparison on a real YOLO11n model, and an annotated demo video. Everything is uploaded as a
# workflow artefact; nothing is committed automatically.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Video to annotate for the demo (any format OpenCV/FFmpeg reads)
        default: https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/vtest.avi
      model:
        description: Ultralytics detection model to export
        default: yolo11n.pt
  push:
    branches: [main]
    paths: [src/**, include/**, apps/**, scripts/**, .github/workflows/demo.yml]

jobs:
  demo:
    runs-on: ubuntu-24.04
    env:
      VIDEO_URL: ${{ github.event.inputs.video_url || 'https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/vtest.avi' }}
      MODEL: ${{ github.event.inputs.model || 'yolo11n.pt' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libopencv-dev ffmpeg
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r scripts/requirements.txt

      - name: Build (Release)
        run: |
          cmake --preset release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 -DTAKT_BUILD_TESTS=OFF
          cmake --build --preset release

      - name: Export model and fetch inputs
        run: |
          python scripts/export_yolo.py --weights "$MODEL" --out models
          curl -sSL -o models/bus.jpg https://ultralytics.com/images/bus.jpg
          curl -sSL -o models/demo_input "$VIDEO_URL"
          echo "ONNX_MODEL=$(ls models/*.onnx | head -1)" >> "$GITHUB_ENV"

      - name: Parity with Ultralytics
        # Same ONNX file on both sides: any difference comes from takt's preprocessing, decoding,
        # NMS or box scaling. Portrait (bus) and landscape (zidane) exercise both padding axes.
        run: |
          mkdir -p results
          curl -sSL -o models/zidane.jpg https://ultralytics.com/images/zidane.jpg
          status=0
          for name in bus zidane; do
            python scripts/parity_reference.py --model "$ONNX_MODEL" --image models/$name.jpg               --json results/parity_ref_$name.json
            ./build/release/apps/takt_run --model "$ONNX_MODEL" --source models/$name.jpg               --policy block --no-track --stats-ms 0 --jsonl results/parity_takt_$name.jsonl > /dev/null
            python scripts/check_parity.py results/parity_ref_$name.json results/parity_takt_$name.jsonl               --tol-px 1.0 --tol-score 0.01 --report results/parity_$name.json || status=1
          done
          exit $status

      - name: Machine info
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread' | tee results-machine.txt

      - name: C++ vs Python across model sizes
        # Same image, same ONNX Runtime settings, 200 timed frames after 20 warm-up frames each.
        run: |
          mkdir -p results/models docs/assets
          for m in yolo11n yolo11s yolo11m; do
            [ -f models/$m.onnx ] || python scripts/export_yolo.py --weights $m.pt --out models > /dev/null
            ./build/release/apps/takt_bench --model models/$m.onnx --image models/bus.jpg \
              --iterations 200 --warmup 20 --json results/models/${m}_cpp.json
            python scripts/python_baseline.py --model models/$m.onnx --image models/bus.jpg \
              --iterations 200 --warmup 20 --json results/models/${m}_python.json
          done
          SUB="bus.jpg (810x1080) at 640x640, ONNX Runtime 1.30 CPU, same machine and settings, median of 200 frames."
          python scripts/plot_latency.py compare \
            --run "C++ (takt-vision)=results/models/yolo11n_cpp.json" \
            --run "Python (NumPy + OpenCV)=results/models/yolo11n_python.json" \
            --subtitle "YOLO11n, $SUB" --out docs/assets/cpp_vs_python
          python scripts/plot_latency.py models --dir results/models --models yolo11n yolo11s yolo11m \
            --subtitle "$SUB" --out docs/assets/model_sizes --table results/models/table.md
          { echo "## C++ vs Python across model sizes"; cat results/models/table.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pipelined vs sequential throughput
        # Offline (unpaced) processing must use a lossless policy; with `latest` the pipeline
        # would rightly drop every frame it cannot keep up with.
        run: |
          ./build/release/apps/takt_run --model "$ONNX_MODEL" --source models/demo_input \
            --no-realtime --policy block --stats-ms 0 --report results/throughput_pipelined.json
          ./build/release/apps/takt_run --model "$ONNX_MODEL" --source models/demo_input \
            --no-realtime --sequential --stats-ms 0 --report results/throughput_sequential.json

      - name: Overload experiment
        run: |
          sed -i 's/^python3 /python /' scripts/overload_experiment.sh
          bash scripts/overload_experiment.sh ./build/release/apps/takt_run 20

      - name: Annotated demo video
        run: |
          ./build/release/apps/takt_run --model "$ONNX_MODEL" --source models/demo_input \
            --policy block --no-realtime --stats-ms 0 --out-video results/demo_raw.mp4             --report results/demo.json
          ffmpeg -loglevel error -y -i results/demo_raw.mp4 -c:v libx264 -pix_fmt yuv420p -crf 23 results/demo.mp4
          ffmpeg -loglevel error -y -i results/demo_raw.mp4 \
            -vf "fps=10,scale=640:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse" \
            -t 10 results/demo.gif

      - uses: actions/upload-artifact@v4
        with:
          name: takt-vision-demo
          retention-days: 14
          path: |
            docs/assets/
            results/
            results-machine.txt
